title: Brandon Arriaga
description: "Físico · Data Scientist · AI/ML Engineer — Puebla, MX 🇲🇽"

url: "https://tbyatkdc.github.io"
baseurl: ""

# Autor
author: Brandon Yahir Arriaga Tlapa
avatar: /img/avatar.jpg   # <-- sube aquí tu foto (cuadrada, mínimo 400x400px)

# ---- Navbar ----
navbar-links:
  Sobre mí: aboutme
  Proyectos: projects
  Blog: blog
  Contacto: contacto

navbar-col:        "#0a0a0a"
navbar-text-col:   "#f0f0f0"
navbar-border-col: "#1a1a2e"

# ---- Página de inicio ----
title-img: /img/avatar.jpg

# ---- Redes sociales ----
social-network-links:
  email:    tbyat.kdc@gmail.com
  github:   tbyatkdc
  linkedin: arriaga-tlapa-brandon

# ---- Footer ----
footer-col:       "#0a0a0a"
footer-text-col:  "#aaaaaa"
footer-link-col:  "#4fc3f7"

# ---- Colores generales ----
page-col:        "#ffffff"
text-col:        "#1a1a1a"
link-col:        "#1565c0"
hover-col:       "#0d47a1"

# ---- Posts / Blog ----
paginate:           5
paginate_path:      "/blog/page:num/"

# ---- Jekyll settings ----
markdown:           kramdown
highlighter:        rouge
permalink:          /:year-:month-:day-:title/
timezone:           America/Mexico_City

plugins:
  - jekyll-paginate
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
