title: Brandon Arriaga
description: "Physicist · Data Scientist · AI/ML Engineer — Puebla, Mexico"
url: "https://tbyatkdc.github.io"
baseurl: ""

# Autor
author: Brandon Yahir Arriaga Tlapa
avatar: /img/profile.png

# ---- Navbar ----
navbar-links:
  About: aboutme
  Projects: projects
  Contact: contacto

navbar-col:        "#0d1117"
navbar-text-col:   "#c9d1d9"
navbar-border-col: "#21262d"

# ---- Página de inicio ----
title-img: /img/profile1.png

# ---- Redes sociales ----
social-network-links:
  email:    tbyat.kdc@gmail.com
  github:   tbyatkdc
  linkedin: arriaga-brandon-byat

# ---- Footer ----
footer-col:       "#0d1117"
footer-text-col:  "#8b949e"
footer-link-col:  "#58a6ff"

# ---- Colores generales ----
page-col:        "#ffffff"
text-col:        "#1c1c1e"
link-col:        "#0969da"
hover-col:       "#0550ae"

# ---- Posts / Blog ----
paginate:           5
paginate_path:      "/blog/page:num/"

# ---- Jekyll settings ----
markdown:           kramdown
highlighter:        rouge
permalink:          /:year-:month-:day-:title/
timezone:           America/Mexico_City

plugins:
  - jekyll-paginate
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
